<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hasani Books Payroll Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hbpayroll">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/hbpayroll-180.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/hbpayroll-192.png?v=2"/>

  <title>hbpayroll</title>
  <link rel="manifest" href="manifest.json?v=2">
</head>
<body>
  <script>
    window.reloadLatestPayrollApp = async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((item) => item.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }

      const latestUrl = new URL(window.location.href);
      latestUrl.searchParams.set('_app_refresh', Date.now().toString());
      window.location.replace(latestUrl.toString());
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove Flutter's retired PWA cache once so phones do not keep loading an
    // older payroll UI after a deployment.
    (async () => {
      const cacheVersion = '2026-09-18-payslip-year-buttons-v4';
      const versionKey = 'hasani-payroll-cache-version';
      if (localStorage.getItem(versionKey) !== cacheVersion) {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((item) => item.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        localStorage.setItem(versionKey, cacheVersion);
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=' + cacheVersion;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
