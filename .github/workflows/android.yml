name: Build Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # JAVA
      # Flutter/Android Gradle builds need Java available explicitly
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================================
      # FLUTTER
      # ==========================================================
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # ==========================================================
      # ENVIRONMENT INFO
      # ==========================================================
      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================
      - name: Install dependencies
        run: flutter pub get

      # ==========================================================
      # FORMAT CHECK
      #
      # Do not include "test" here because GitHub Actions will fail
      # if your project does not currently contain a test directory.
      # ==========================================================
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      # ==========================================================
      # ANALYZE
      # ==========================================================
      - name: Analyze source
        run: flutter analyze

      # ==========================================================
      # TEST
      # Run only when test files actually exist.
      # ==========================================================
      - name: Run tests
        shell: bash
        run: |
          if [ -d "test" ] && find test -type f -name "*_test.dart" | grep -q .; then
            echo "Tests found. Running Flutter tests..."
            flutter test --no-pub
          else
            echo "No Flutter tests found. Skipping test step."
          fi

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Build release APK
        run: flutter build apk --release --no-pub

      # ==========================================================
      # BUILD AAB
      # This is the file normally uploaded to Google Play.
      # ==========================================================
      - name: Build release app bundle
        run: flutter build appbundle --release --no-pub

      # ==========================================================
      # VERIFY OUTPUT
      # ==========================================================
      - name: Verify Android artifacts
        shell: bash
        run: |
          echo "Checking build outputs..."

          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          echo "AAB:"
          ls -lh "$AAB"

      # ==========================================================
      # UPLOAD
      # ==========================================================
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HASANI-PAYROLL-ANDROID
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
