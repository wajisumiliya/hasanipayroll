name: App user migration preflight
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Compare source and target account coverage
        working-directory: backend
        env:
          SUPABASE_SOURCE_DATABASE_URL: ${{ secrets.SUPABASE_SOURCE_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: node src/scripts/check-app-user-migration.js
