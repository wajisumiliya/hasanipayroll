name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, neon-dev, feature/full-neon-migration]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, neon-dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and audit Node backend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bootstrap_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: hasani_bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootstrap_test -d hasani_bootstrap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma client generation
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:generate

      - name: Run backend tests
        env:
          BOOTSTRAP_TEST_DATABASE_URL: postgresql://bootstrap_test:local-ci-fixture-only@127.0.0.1:5432/hasani_bootstrap_test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

