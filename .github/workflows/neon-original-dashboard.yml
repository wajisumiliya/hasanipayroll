name: Original Flutter Dashboard Neon DEV Build

on:
  push:
    branches: [feature/neon-original-dashboard]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/neon-original-dashboard.yml"
  pull_request:
    branches: [neon-dev]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/neon-original-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile original dashboard with Neon API URL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build original Flutter application
        run: flutter build web --release --no-pub --dart-define=API_BASE_URL=http://127.0.0.1:5001
      - name: Verify compilation
        run: test -f build/web/index.html
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: hasani-original-dashboard-neon-dev
          path: build/web/
          retention-days: 7

# Compile-only. Runtime API and login require a locally running Neon DEV backend.
# This workflow never deploys or modifies production.
