name: Prepare JWT client formatting
on:
  push:
    branches: [codex/remove-remaining-supabase]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/services/neon_api.dart
      - run: |
          echo JWT_FORMAT_BEGIN
          base64 -w 0 lib/services/neon_api.dart
          echo
          echo JWT_FORMAT_END
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - run: npm ci
