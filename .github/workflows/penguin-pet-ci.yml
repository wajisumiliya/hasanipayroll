name: Penguin Pet checks
on:
  push:
    branches: [feature/realistic-penguin-pet]
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/penguin-pet-api.js'
      - 'backend/test/penguin-pet-api.test.js'
      - 'lib/widgets/employee_penguin_pet_card.dart'
      - 'test/employee_penguin_pet_test.dart'
      - 'lib/screens/employee_portal.dart'
      - '.github/workflows/penguin-pet-ci.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run penguin API tests
        run: node --test backend/test/penguin-pet-api.test.js
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze penguin widget
        run: flutter analyze lib/widgets/employee_penguin_pet_card.dart test/employee_penguin_pet_test.dart
      - name: Run penguin widget test
        run: flutter test test/employee_penguin_pet_test.dart
